services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    # Dev only. Production is Railway, which runs start.sh (gunicorn) from the
    # Dockerfile and never reads this file — so this side is free to optimise
    # for the edit/refresh loop instead of prod parity.
    #
    # runserver, not gunicorn: it reloads on Python changes. Templates already
    # reloaded (DEBUG + bind mount); views and models did not, and needed a
    # `docker compose restart web` to take effect.
    #
    # The parens matter. `a && b || true && c` parses as `((a && b) || true) && c`,
    # so a failed migrate would still have started the server.
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py createsuperuser --noinput || true) &&
             python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/home/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "1"
      PGDATABASE: mydb
      PGUSER: myuser
      PGPASSWORD: mypassword
      PGHOST: db
      PGPORT: 5432
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin123
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}


  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
